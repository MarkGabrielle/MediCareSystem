<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>MediCare - Login</title>

    <link rel="stylesheet" href="style.css">
    <script src="script.js"></script>

</head>

<body>

<header>

    <div class="logo">

        <img src="medicarelogo.jpeg" alt="MediCare Logo">

        <div class="logo-text">
            <h1>MediCare</h1>
            <p>Hospital Staff Scheduling System</p>
        </div>

    </div>

    <nav>
    <a href="index.html">Home</a>
    <a href="#">Staff</a>
    <a href="#">Schedule</a>
    <a href="#">Replacement</a>
    <a href="#">Approval</a>
    <a href="#">Open and Swap</a>

    <a href="login.html" class="login-btn" id="loginLink">Login</a>

</nav>



</header>

<section class="login-section">

    <div class="login-card">

        <div class="login-logo">
            <img src="medicarelogo.jpeg" alt="MediCare Logo">
        </div>

        <h2>Welcome Back</h2>

        <p class="login-subtitle">
            Sign in to access the MediCare system
        </p>

        <form onsubmit="loginUser(event)">

            <label for="username">Username</label>

            <div class="input-box">
                <span>👤</span>

                <input
                    type="text"
                    id="username"
                    placeholder="Enter your username"
                >
            </div>

            <label for="password">Password</label>

            <div class="input-box">
                <span>🔒</span>

                <input
                    type="password"
                    id="password"
                    placeholder="Enter your password"
                >
            </div>

            <label for="account">Account Type</label>

            <div class="input-box">
                <span>🏥</span>

                <select id="account" required>
            <option value="" disabled selected>Select Account</option>
            <option value="Nurse">Nurse</option>
            <option value="Doctor">Doctor</option>
            <option value="HR">HR</option>
            <option value="Admin">Admin</option>
            </select>
            </div>

            <button type="submit" class="login-submit">
                Login to MediCare
            </button>

            <p id="message"></p>

        </form>

        <div class="login-footer">
            <p>Secure Hospital Staff Management System</p>
        </div>

    </div>

</section>

<footer>

    <h3>MediCare</h3>

    <p>
        Hospital Staff Scheduling and Shift Management System
    </p>

    <p>
        © 2026 MediCare
    </p>

</footer>
</body>
</html>
